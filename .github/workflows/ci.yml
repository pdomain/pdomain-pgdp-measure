name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Chore: review pinned action SHAs weekly. Update the version comment and the
# full commit SHA together after checking the upstream release tag.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v8.1.0
        with:
          version: "0.12.1"
      - run: make setup
      - run: make lint-check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v8.1.0
        with:
          version: "0.12.1"
      - run: make setup
      - run: make typecheck

  test:
    name: "test / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This package pins requires-python to >=3.13,<3.14, so the matrix
        # carries the one supported interpreter rather than the 3.11-3.13
        # spread its siblings use.
        python-version: ["3.13"]
    env:
      UV_PYTHON: "${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v8.1.0
        with:
          version: "0.12.1"
      - run: make setup
      - run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v8.1.0
        with:
          version: "0.12.1"
      - run: make setup
      - run: make build
